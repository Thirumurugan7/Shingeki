  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"418e9b1c-ebd8-437b-aed9-d9bc968744e2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n\n<style>\n  :root {\n    --black: oklch(4% 0.008 0);\n    --surface: oklch(8% 0.01 10);\n    --surface2: oklch(12% 0.012 10);\n    --border: oklch(20% 0.015 10);\n    --red: oklch(48% 0.22 25);\n    --red-bright: oklch(58% 0.24 22);\n    --red-dim: oklch(35% 0.18 25);\n    --red-glow: oklch(48% 0.22 25 / 0.35);\n    --white: oklch(95% 0.004 60);\n    --muted: oklch(55% 0.01 60);\n    --muted2: oklch(38% 0.01 60);\n    --font-display: 'Bebas Neue', sans-serif;\n    --font-body: 'DM Sans', sans-serif;\n    --font-mono: 'JetBrains Mono', monospace;\n  }\n\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html { scroll-behavior: smooth; }\n\n  body {\n    background: var(--black);\n    color: var(--white);\n    font-family: var(--font-body);\n    overflow-x: hidden;\n    line-height: 1.6;\n  }\n\n  /* ── SCANLINE OVERLAY ─────────────────────── */\n  body::before {\n    content: '';\n    position: fixed;\n    inset: 0;\n    background: repeating-linear-gradient(\n      0deg,\n      transparent,\n      transparent 2px,\n      oklch(0% 0 0 / 0.04) 2px,\n      oklch(0% 0 0 / 0.04) 4px\n    );\n    pointer-events: none;\n    z-index: 9999;\n  }\n\n  /* ── NOISE TEXTURE ────────────────────────── */\n  body::after {\n    content: '';\n    position: fixed;\n    inset: 0;\n    background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter ve Mesh · On-Chain Verified<\u002Fdiv>\n\n    <h1 class=\"hero-title reveal reveal-delay-1\">\n      <span class=\"jp-title\">進撃<\u002Fspan>\n      <span class=\"glitch\" data-text=\"SHINGEKI\">SHINGEKI<\u002Fspan>\n    <\u002Fh1>\n\n    <p class=\"hero-sub reveal reveal-delay-2\">\n      Agents that always <strong>move forward.<\u002Fstrong><br>\n      A distributed cognitive mesh where AI nodes <strong>compete, evolve,<\u002Fstrong> and log every decision <strong>on-chain<\u002Fstrong> — fully verifiable, unstoppable.\n    <\u002Fp>\n\n    <div class=\"hero-ctas reveal reveal-delay-3\">\n      <a href=\"https://github.com/Thirumurugan7/Shingeki\" target=\"_blank\" class=\"btn-primary\">\n        ⬡ View on GitHub\n      <\u002Fa>\n      <a href=\"#\" class=\"btn-secondary\">Read the Docs →<\u002Fa>\n      <a href=\"#\" class=\"btn-secondary\">npm install shingeki →<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"hero-stats reveal reveal-delay-4\">\n      <div class=\"stat\">\n        <div class=\"stat-num\"><span class=\"accent\">∞<\u002Fspan><\u002Fdiv>\n        <div class=\"stat-label\">Node Capacity<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat-num\">0G<\u002Fdiv>\n        <div class=\"stat-label\">Log Store<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat-num\"><span class=\"accent\">TEE<\u002Fspan><\u002Fdiv>\n        <div class=\"stat-label\">Verified<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat-num\">≥22<\u002Fdiv>\n        <div class=\"stat-label\">Node.js<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"full-divider\"><\u002Fdiv>\n\n<!-- ── COMPARISON ────────────────────────────── -->\n<section id=\"compare\">\n  <div class=\"section-label reveal\">01 — Intelligence Superiority<\u002Fdiv>\n  <h2 class=\"section-title reveal reveal-delay-1\">What makes it<br><span style=\"color:var(--red-bright)\">different.<\u002Fspan><\u002Fh2>\n  <p class=\"section-desc reveal reveal-delay-2\">Every other framework runs one LLM after another on a fixed track. Shingeki distributes, competes, and evolves — on verifiable infrastructure.<\u002Fp>\n\n  <div class=\"table-wrap reveal reveal-delay-3\">\n    <table>\n      <thead>\n        <tr>\n          <th>Framework<\u002Fth>\n          <th>Architecture<\u002Fth>\n          <th>Evolution<\u002Fth>\n          <th class=\"th-highlight\">Verified<\u002Fth>\n        <\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr>\n          <td>LangChain<\u002Ftd>\n          <td>Single chain, single node<\u002Ftd>\n          <td>Static prompts<\u002Ftd>\n          <td class=\"td-highlight\"><span class=\"badge-no\">— None<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td>AutoGen<\u002Ftd>\n          <td>Agent pairs, static roles<\u002Ftd>\n          <td>Static<\u002Ftd>\n          <td class=\"td-highlight\"><span class=\"badge-no\">— None<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td>CrewAI<\u002Ftd>\n          <td>Fixed crew, sequential<\u002Ftd>\n          <td>Static<\u002Ftd>\n          <td class=\"td-highlight\"><span class=\"badge-no\">— None<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr class=\"shingeki-row\">\n          <td>Shingeki<\u002Ftd>\n          <td>Distributed mesh<\u002Ftd>\n          <td>Genome-driven (live TEE scoring)<\u002Ftd>\n          <td class=\"td-highlight\"><span class=\"badge-tee\">TEE ✓ + 0G Log<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"full-divider\"><\u002Fdiv>\n\n<!-- ── HOW IT WORKS ───────────────────────────── -->\n<section id=\"how\">\n  <div class=\"how-header\">\n    <div>\n      <div class=\"section-label reveal\">02 — Mechanics<\u002Fdiv>\n      <h2 class=\"section-title reveal reveal-delay-1\">How it<br><span style=\"color:var(--red-bright)\">works.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"section-desc reveal reveal-delay-2\" style=\"align-self:start;margin-top:16px;\">Three interlocking systems: a living genome, a competitive mesh, and a relentless fitness engine that never lets quality slip.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"how-cards\">\n    <!-- GENOME -->\n    <div class=\"how-card reveal reveal-delay-1\">\n      <div class=\"how-card-num\">01<\u002Fdiv>\n      <div class=\"how-card-icon\">\n        <svg viewBox=\"0 0 44 44\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n          <path d=\"M22 4C22 4 14 10 14 22C14 34 22 40 22 40\" stroke=\"oklch(48% 0.22 25)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M22 4C22 4 30 10 30 22C30 34 22 40 22 40\" stroke=\"oklch(48% 0.22 25 / 0.5)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath>\n          <line x1=\"14\" y1=\"15\" x2=\"30\" y2=\"15\" stroke=\"oklch(48% 0.22 25 / 0.7)\" stroke-width=\"1.5\"><\u002Fline>\n          <line x1=\"12\" y1=\"22\" x2=\"32\" y2=\"22\" stroke=\"oklch(48% 0.22 25 / 0.7)\" stroke-width=\"1.5\"><\u002Fline>\n          <line x1=\"14\" y1=\"29\" x2=\"30\" y2=\"29\" stroke=\"oklch(48% 0.22 25 / 0.7)\" stroke-width=\"1.5\"><\u002Fline>\n          <circle cx=\"22\" cy=\"22\" r=\"2.5\" fill=\"oklch(58% 0.24 22)\" style=\"filter:drop-shadow(0 0 4px oklch(58% 0.24 22))\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"how-card-label\">System 01<\u002Fdiv>\n      <div class=\"how-card-title\">Genome<\u002Fdiv>\n      <div class=\"how-card-body\">\n        Every node carries a <strong>genome<\u002Fstrong> — a config object holding model, strategy, tools, reflection depth, and mutation rate. The genome is the agent's identity.\n        <br><br>\n        Starts from <code style=\"font-family:var(--font-mono);font-size:12px;color:var(--red-bright)\">agentmesh.example.yaml<\u002Fcode> and <strong>mutates automatically<\u002Fstrong> when output quality drops below threshold.\n      <\u002Fdiv>\n      <div class=\"how-card-tags\">\n        <span class=\"tag\">Model<\u002Fspan>\n        <span class=\"tag\">Strategy<\u002Fspan>\n        <span class=\"tag\">Mutation Rate<\u002Fspan>\n        <span class=\"tag\">Reflection Depth<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MESH -->\n    <div class=\"how-card reveal reveal-delay-2\">\n      <div class=\"how-card-num\">02<\u002Fdiv>\n      <div class=\"how-card-icon\">\n        <svg viewBox=\"0 0 44 44\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n          <circle cx=\"8\" cy=\"22\" r=\"3.5\" stroke=\"oklch(48% 0.22 25)\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"22\" cy=\"8\" r=\"3.5\" stroke=\"oklch(48% 0.22 25)\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"36\" cy=\"22\" r=\"3.5\" stroke=\"oklch(48% 0.22 25)\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"22\" cy=\"36\" r=\"3.5\" stroke=\"oklch(48% 0.22 25)\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"22\" cy=\"22\" r=\"4\" fill=\"oklch(48% 0.22 25 / 0.2)\" stroke=\"oklch(58% 0.24 22)\" stroke-width=\"1.5\" style=\"filter:drop-shadow(0 0 4px oklch(58% 0.24 22))\"><\u002Fcircle>\n          <line x1=\"11.5\" y1=\"22\" x2=\"18\" y2=\"22\" stroke=\"oklch(48% 0.22 25 / 0.6)\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"26\" y1=\"22\" x2=\"32.5\" y2=\"22\" stroke=\"oklch(48% 0.22 25 / 0.6)\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"22\" y1=\"11.5\" x2=\"22\" y2=\"18\" stroke=\"oklch(48% 0.22 25 / 0.6)\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"22\" y1=\"26\" x2=\"22\" y2=\"32.5\" stroke=\"oklch(48% 0.22 25 / 0.6)\" stroke-width=\"1\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"how-card-label\">System 02<\u002Fdiv>\n      <div class=\"how-card-title\">Mesh<\u002Fdiv>\n      <div class=\"how-card-body\">\n        The orchestrator dispatches plan steps across nodes over <strong>WebSocket<\u002Fstrong>. Step 1 runs on <strong>all nodes in parallel<\u002Fstrong> — a fitness scorer picks the winner. Subsequent steps use round-robin + domain-aware routing.\n        <br><br>\n        Nodes advertise specializations like <strong>research<\u002Fstrong> or <strong>planning<\u002Fstrong>.\n      <\u002Fdiv>\n      <div class=\"how-card-tags\">\n        <span class=\"tag\">WebSocket<\u002Fspan>\n        <span class=\"tag\">Parallel<\u002Fspan>\n        <span class=\"tag\">Round-Robin<\u002Fspan>\n        <span class=\"tag\">Domain Routing<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- EVOLUTION -->\n    <div class=\"how-card reveal reveal-delay-3\">\n      <div class=\"how-card-num\">03<\u002Fdiv>\n      <div class=\"how-card-icon\">\n        <svg viewBox=\"0 0 44 44\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n          <polyline points=\"4,32 12,20 20,26 28,12 36,18 40,10\" stroke=\"oklch(48% 0.22 25)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <circle cx=\"40\" cy=\"10\" r=\"3\" fill=\"oklch(58% 0.24 22)\" style=\"filter:drop-shadow(0 0 6px oklch(58% 0.24 22))\"><\u002Fcircle>\n          <circle cx=\"28\" cy=\"12\" r=\"2\" fill=\"oklch(48% 0.22 25 / 0.5)\"><\u002Fcircle>\n          <circle cx=\"20\" cy=\"26\" r=\"2\" fill=\"oklch(48% 0.22 25 / 0.5)\"><\u002Fcircle>\n          <line x1=\"28\" y1=\"36\" x2=\"28\" y2=\"30\" stroke=\"oklch(48% 0.22 25 / 0.4)\" stroke-width=\"1\" stroke-dasharray=\"2,2\"><\u002Fline>\n          <polyline points=\"24,34 28,38 32,34\" stroke=\"oklch(48% 0.22 25 / 0.4)\" stroke-width=\"1\" fill=\"none\"><\u002Fpolyline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"how-card-label\">System 03<\u002Fdiv>\n      <div class=\"how-card-title\">Evolution<\u002Fdiv>\n      <div class=\"how-card-body\">\n        After every step, a <strong>two-path fitness scorer<\u002Fstrong> evaluates output: a fast heuristic pre-filter, then a <strong>TEE-verified LLM judge<\u002Fstrong>. If quality drops, the genome mutates.\n        <br><br>\n        Every mutation is recorded to the <strong>lineage store<\u002Fstrong>, visible live in the browser viewer.\n      <\u002Fdiv>\n      <div class=\"how-card-tags\">\n        <span class=\"tag\">Heuristic<\u002Fspan>\n        <span class=\"tag\">TEE Judge<\u002Fspan>\n        <span class=\"tag\">Lineage Store<\u002Fspan>\n        <span class=\"tag\">Live Viewer<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"full-divider\"><\u002Fdiv>\n\n<!-- ── ARCHITECTURE ───────────────────────────── -->\n<section id=\"arch\">\n  <div class=\"arch-header\">\n    <div>\n      <div class=\"section-label reveal\">03 — Structure<\u002Fdiv>\n      <h2 class=\"section-title reveal reveal-delay-1\">Architecture.<\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"section-desc reveal reveal-delay-2\" style=\"align-self:start;margin-top:16px;\">Three views of the same system — from high-level flow, to execution sequence, to a full layer-by-layer breakdown.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- TABS -->\n  <div class=\"arch-tabs reveal reveal-delay-3\">\n    <div class=\"arch-tab active\" data-arch=\"flow\">Flow Chart<\u002Fdiv>\n    <div class=\"arch-tab\" data-arch=\"seq\">Execution Sequence<\u002Fdiv>\n    <div class=\"arch-tab\" data-arch=\"layers\">Layer Reference<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ── PANEL 1: FLOWCHART ── -->\n  <div class=\"arch-panel active reveal reveal-delay-4\" id=\"arch-flow\">\n    <div class=\"flowchart\">\n\n      <!-- Row 0: Entry Points -->\n      <div class=\"flow-row\">\n        <div class=\"flow-group\" style=\"flex:1\">\n          <div class=\"flow-group-label\">Entry Points<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">CLI<\u002Fdiv><div class=\"flow-node-sub\">npm run demo / hub / node / run<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">POST /api/run<\u002Fdiv><div class=\"flow-node-sub\">MeshHub HTTP<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">Programmatic SDK<\u002Fdiv><div class=\"flow-node-sub\">import from 'shingeki'<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-arrow\">→<\u002Fdiv>\n        <div class=\"flow-group\" style=\"flex:2\">\n          <div class=\"flow-group-label\">Planner<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">planTask / splitCompoundTask<\u002Fdiv><div class=\"flow-node-sub\">detects compound tasks · infers domain per step (research · planning · coding · defi)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">Presets<\u002Fdiv><div class=\"flow-node-sub\">planResearchAnalyzeDecide · planJapanTrip · defiPlan<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"flow-connector-row\">\n        <div class=\"flow-connector-cell\"><\u002Fdiv>\n        <div class=\"flow-connector-cell active-line\">↓<\u002Fdiv>\n        <div class=\"flow-connector-cell\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Row 1: Orchestrator -->\n      <div class=\"flow-row\">\n        <div class=\"flow-group red-accent\" style=\"flex:1\">\n          <div class=\"flow-group-label\">MeshOrchestrator<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">Step 1 → PARALLEL competition<\u002Fdiv><div class=\"flow-node-sub\">all available nodes race · best score wins<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">Steps 2–N → round-robin<\u002Fdiv><div class=\"flow-node-sub\">domain-aware routing · retry fallback<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">Crash recovery<\u002Fdiv><div class=\"flow-node-sub\">writeCheckpointAtomic · resume --resume task-id<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-arrow\">→<\u002Fdiv>\n        <div class=\"flow-group\" style=\"flex:1\">\n          <div class=\"flow-group-label\">NodeRuntime<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">executes one plan step<\u002Fdiv><div class=\"flow-node-sub\">builds prompt with prior context · calls 0G Router<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">Uniswap Tool<\u002Fdiv><div class=\"flow-node-sub\">scans LLM output for {tool:uniswap_quote,...} · executes if found<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-arrow\">→<\u002Fdiv>\n        <div class=\"flow-group red-accent\" style=\"flex:1\">\n          <div class=\"flow-group-label\">0G Network<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">0G Router<\u002Fdiv><div class=\"flow-node-sub\">LLM inference · provider sort: latency · verify_tee: true always on<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">0G Log Store<\u002Fdiv><div class=\"flow-node-sub\">per-step trace · input · output · TEE flag · rootHash · append-only<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">0G KV Store<\u002Fdiv><div class=\"flow-node-sub\">final genome checkpoint after task completes<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"flow-connector-row\">\n        <div class=\"flow-connector-cell active-line\">↓<\u002Fdiv>\n        <div class=\"flow-connector-cell active-line\">↓<\u002Fdiv>\n        <div class=\"flow-connector-cell\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Row 2: Genome + Uniswap -->\n      <div class=\"flow-row\">\n        <div class=\"flow-group\" style=\"flex:1\">\n          <div class=\"flow-group-label\">Genome (Agent Identity)<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">id · model · strategy · tools · reflection_depth · mutation_rate<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">Fitness Scorer — two paths<\u002Fdiv><div class=\"flow-node-sub\">① Heuristic: length · bullets · numbers · domain keywords (0 tokens)<br>② LLM Judge: ~128 tokens · verify_tee:true (score &lt; 0.55 only)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">Genome Mutator<\u002Fdiv><div class=\"flow-node-sub\">cycles: prompt → model → strategy · recorded in lineage store<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-arrow\">↔<\u002Fdiv>\n        <div class=\"flow-group\" style=\"flex:1\">\n          <div class=\"flow-group-label\">Uniswap Trade API<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">POST /v1/quote<\u002Fdiv><div class=\"flow-node-sub\">BEST_PRICE routing · UNISWAPX_V2 · V4 · V3 · V2<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">POST /v1/swap<\u002Fdiv><div class=\"flow-node-sub\">build calldata · not submitted — returned to wallet<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">POST /v1/check_approval<\u002Fdiv><div class=\"flow-node-sub\">approval tx or null · Dutch guard: classic only in MVP<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-arrow\">↔<\u002Fdiv>\n        <div class=\"flow-group\" style=\"flex:1\">\n          <div class=\"flow-group-label\">Distributed Coordination<\u002Fdiv>\n          <div class=\"flow-nodes\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">MeshHub<\u002Fdiv><div class=\"flow-node-sub\">WebSocket + HTTP · /health /ready /metrics /status /lineage /viewer<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">Worker Nodes<\u002Fdiv><div class=\"flow-node-sub\">NODE_ROLE: executor · critic · reasoning · memory · general<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">AXL P2P Transport<\u002Fdiv><div class=\"flow-node-sub\">Gensyn sidecar · HTTP /topology /send /recv · AXL_ENABLED=true<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"flow-connector-row\">\n        <div class=\"flow-connector-cell\"><\u002Fdiv>\n        <div class=\"flow-connector-cell active-line\">↓<\u002Fdiv>\n        <div class=\"flow-connector-cell\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Row 3: Lineage Viewer -->\n      <div class=\"flow-row\">\n        <div class=\"flow-group\" style=\"flex:3; background: oklch(48% 0.22 25 / 0.04); border-color: oklch(48% 0.22 25 / 0.3);\">\n          <div class=\"flow-group-label\">Lineage Viewer<\u002Fdiv>\n          <div class=\"flow-nodes\" style=\"flex-direction:row; gap:40px; flex-wrap:wrap;\">\n            <div class=\"flow-node\"><span class=\"flow-node-dot\"><\u002Fspan><div><div class=\"flow-node-text\">localhost:8765/viewer<\u002Fdiv><div class=\"flow-node-sub\">live genome mutation tree<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">fitness bars per step<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">TEE verification badges<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"flow-node\"><span class=\"flow-node-dot dim\"><\u002Fspan><div><div class=\"flow-node-text\">parent→child arrows<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ── PANEL 2: SEQUENCE DIAGRAM ── -->\n  <div class=\"arch-panel\" id=\"arch-seq\">\n    <div class=\"seq-wrap\">\n      <div class=\"seq-inner\">\n\n        <!-- Actors -->\n        <div class=\"seq-actors\">\n          <div class=\"seq-actor\"><div class=\"seq-actor-box highlight\">User<\u002Fdiv><\u002Fdiv>\n          <div class=\"seq-actor\"><div class=\"seq-actor-box\">Planner<\u002Fdiv><\u002Fdiv>\n          <div class=\"seq-actor\"><div class=\"seq-actor-box highlight\">Orchestrator<\u002Fdiv><\u002Fdiv>\n          <div class=\"seq-actor\">< \n          <\u002Ftr>\n          <tr>\n            <td>Genome<\u002Ftd>\n            <td>Each agent's identity — model, strategy, tools, mutation rate; evolves automatically when output quality drops<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>Fitness Scorer<\u002Ftd>\n            <td>Two-path: fast heuristic (0 tokens) pre-filters every step; LLM judge (~128 tokens, TEE-verified) fires only below threshold <span class=\"layer-badge tee\">TEE<\u002Fspan><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>Genome Mutator<\u002Ftd>\n            <td>On low score: cycles prompt → model → strategy; every mutation recorded to lineage store<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>NodeRuntime<\u002Ftd>\n            <td>Executes one plan step — builds prompt with prior context, calls 0G Router, runs Uniswap tool if output contains a tool call<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>0G Router<\u002Ftd>\n            <td>TEE-backed LLM inference — every call cryptographically attested, fastest provider selected automatically <span class=\"layer-badge tee\">TEE ✓<\u002Fspan><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>Uniswap Tool<\u002Ftd>\n            <td>LLM embeds {\"tool\":\"uniswap_quote\",...} in output; runtime detects it, calls Trade API, appends quote + swap tx to result<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>0G Log Store<\u002Ftd>\n            <td>Append-only per-step trace — input, output, TEE flag, root hash; anyone can verify what ran <span class=\"layer-badge tee\">Tamper-proof<\u002Fspan><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>0G KV Store<\u002Ftd>\n            <td>Final genome checkpoint written after every completed task<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>MeshHub<\u002Ftd>\n            <td>WebSocket + HTTP coordination hub for distributed mode — /health, /metrics, /lineage, /viewer, POST /api/run<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>AXL Transport<\u002Ftd>\n            <td>Peer-to-peer alternative to WebSocket hub via Gensyn sidecar — no central broker <span class=\"layer-badge p2p\">P2P<\u002Fspan><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>Lineage Viewer<\u002Ftd>\n            <td>Browser UI at /viewer — live tree of genome mutations, fitness bars, TEE badges, parent→child arrows<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<div class=\"full-divider\"><\u002Fdiv>\n\n<!-- ── QUICK START ────────────────────────────── -->\n<section id=\"quickstart\">\n  <div class=\"qs-header\">\n    <div>\n      <div class=\"section-label reveal\">04 — Deploy<\u002Fdiv>\n      <h2 class=\"section-title reveal reveal-delay-1\">Quick<br><span style=\"color:var(--red-bright)\">Start.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"reveal reveal-delay-2\">\n      <p class=\"section-desc\" style=\"margin-bottom:20px;\">Get up in two commands. Or spin up a full distributed mesh across 4 terminals.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n        <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--muted2);border:1px solid var(--border);padding:8px 16px;\">Node.js ≥ 22<\u002Fdiv>\n        <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--muted2);border:1px solid var(--border);padding:8px 16px;\">ROUTER_API_KEY<\u002Fdiv>\n        <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--muted2);border:1px solid var(--border);padding:8px 16px;\">npm ≥ 8<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"reveal reveal-delay-3\">\n    <div class=\"terminal\">\n      <div class=\"terminal-bar\">\n        <span class=\"terminal-dot red\"><\u002Fspan>\n        <span class=\"terminal-dot yellow\"><\u002Fspan>\n        <span class=\"terminal-dot green\"><\u002Fspan>\n        <span class=\"terminal-title\">shingeki — bash<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"terminal-tabs\">\n        <div class=\"terminal-tab active\" data-tab=\"local\">Local Mode<\u002Fdiv>\n        <div class=\"terminal-tab\" data-tab=\"mesh\">Distributed Mesh<\u002Fdiv>\n        <div class=\"terminal-tab\" data-tab=\"resume\">Resume / Presets<\u002Fdiv>\n      <\u002Fdiv>\n\n      <button class=\"copy-btn\" id=\"copy-btn\">Copy<\u002Fbutton>\n\n      <!-- LOCAL -->\n      <div class=\"terminal-content active\" id=\"tab-local\">\n        <div class=\"code-line\"><span class=\"comment\"># Prerequisites: copy .env.example → .env, fill ROUTER_API_KEY<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"blank\"><\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">cd shingeki<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">cp ../.env.example ../.env<\u002Fspan><span class=\"comment\">&nbsp;&nbsp;# edit ROUTER_API_KEY<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">npm install<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"blank\"><\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"comment\"># Run with 2 in-process nodes<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">npm run run<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- MESH -->\n      <div class=\"terminal-content\" id=\"tab-mesh\">\n        <div class=\"code-line\"><span class=\"comment\"># Terminal 1 — coordination hub (opens lineage viewer)<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">npm run hub<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"blank\"><\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"comment\"># Terminal 2 — worker A (research specialist)<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"flag\">NODE_ID<\u002Fspan>=<span class=\"val\">node-1<\u002Fspan> <span class=\"flag\">NODE_ROLE<\u002Fspan>=<span class=\"val\">executor<\u002Fspan> <span class=\"flag\">NODE_SPECIALIZATION<\u002Fspan>=<span class=\"val\">research<\u002Fspan> npm run node<\u002Fdiv>\n        <div class=\"code-line\"><span class=\"blank\"><\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"comment\"># Terminal 3 — worker B (planning specialist)<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"flag\">NODE_ID<\u002Fspan>=<span class=\"val\">node-2<\u002Fspan> <span class=\"flag\">NODE_ROLE<\u002Fspan>=<span class=\"val\">reasoning<\u002Fspan> <span class=\"flag\">NODE_SPECIALIZATION<\u002Fspan>=<span class=\"val\">planning<\u002Fspan> npm run node<\u002Fdiv>\n        <div class=\"code-line\"><span class=\"blank\"><\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"comment\"># Terminal 4 — orchestrator<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">npm run run -- <\u002Fspan><span class=\"flag\">--mesh<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- RESUME -->\n      <div class=\"terminal-content\" id=\"tab-resume\">\n        <div class=\"code-line\"><span class=\"comment\"># Japan trip preset<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">npm run run -- <\u002Fspan><span class=\"flag\">--preset<\u002Fspan> <span class=\"val\">japan<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"blank\"><\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"comment\"># Resume after crash<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">$<\u002Fspan><span class=\"cmd\">npm run run -- <\u002Fspan><span class=\"flag\">--resume<\u002Fspan> <span class=\"val\">task-1746000000000<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"blank\"><\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"comment\"># Lineage viewer opens automatically at:<\u002Fspan><\u002Fdiv>\n        <div class=\"code-line\"><span class=\"prompt\">→<\u002Fspan><span class=\"val\">&nbsp;http://localhost:8765/viewer<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 0G STRIP ───────────────────────────────── -->\n<div id=\"og-strip\">\n  <div class=\"og-inner\">\n    <div>\n      <div class=\"section-label reveal\">0G Integration<\u002Fdiv>\n      <h2 class=\"section-title reveal reveal-delay-1\" style=\"font-size:clamp(40px,5vw,64px)\">Tamper-proof<br><span style=\"color:var(--red-bright)\">by design.<\u002Fspan><\u002Fh2>\n      <p class=\"section-desc reveal reveal-delay-2\" style=\"margin-top:20px;\">Every inference call, every fitness score, every genome mutation — anchored on 0G's decentralized infrastructure. Any participant can verify what ran, on what model, and with what result.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"og-cards reveal reveal-delay-2\">\n      <div class=\"og-card\">\n        <div class=\"og-card-primitive\">Router<\u002Fdiv>\n        <div class=\"og-card-title\">0G Router<\u002Fdiv>\n        <div class=\"og-card-desc\">Every LLM step and fitness evaluation judge. TEE signature + fastest-provider routing always on.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"og-card\">\n        <div class=\"og-card-primitive\">Log Store<\u002Fdiv>\n        <div class=\"og-card-title\">Trace Log<\u002Fdiv>\n        <div class=\"og-card-desc\">Per-step execution trace — input, output, TEE flag, rootHash — append-only after each step.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"og-card\">\n        <div class=\"og-card-primitive\">KV Store<\u002Fdiv>\n        <div class=\"og-card-title\">Genome KV<\u002Fdiv>\n        <div class=\"og-card-desc\">Final genome state checkpoint written to 0G KV Store after finalize(). Crash-safe and verifiable.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── FOOTER ─────────────────────────────────── -->\n<footer>\n  <div class=\"footer-top\">\n    <div>\n      <div class=\"footer-logo\"><span class=\"jp\">進撃<\u002Fspan> Shingeki<\u002Fdiv>\n      <p class=\"footer-tagline\">A distributed cognitive mesh where AI agents compete, evolve, and log every decision to tamper-proof storage.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div class=\"footer-col-title\">Project<\u002Fdiv>\n      <ul class=\"footer-links\">\n        <li><a href=\"https://github.com/Thirumurugan7/Shingeki\" target=\"_blank\">GitHub<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Documentation<\u002Fa><\u002Fli>\n        <li><a href=\"#\">npm Package<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Changelog<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <div class=\"footer-col-title\">Learn<\u002Fdiv>\n      <ul class=\"footer-links\">\n        <li><a href=\"#how\">How it Works<\u002Fa><\u002Fli>\n        <li><a href=\"#arch\">Architecture<\u002Fa><\u002Fli>\n        <li><a href=\"#compare\">Comparison<\u002Fa><\u002Fli>\n        <li><a href=\"#quickstart\">Quick Start<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <div class=\"footer-col-title\">0G Network<\u002Fdiv>\n      <ul class=\"footer-links\">\n        <li><a href=\"https://pc.0g.ai\" target=\"_blank\">0G Dashboard<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Router API<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Log Store<\u002Fa><\u002Fli>\n        <li><a href=\"#\">KV Store<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"footer-bottom\">\n    <div class=\"footer-copy\">\n      © 2026 Shingeki — Built for the <span class=\"red\">0G<\u002Fspan> ecosystem.\n    <\u002Fdiv>\n    <a href=\"https://github.com/Thirumurugan7/Shingeki\" target=\"_blank\" class=\"footer-github\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"currentColor\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>\n      Star on GitHub\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n// ── MESH CANVAS ANIMATION ──────────────────────────────────────────────────\n(function() {\n  const canvas = document.getElementById('mesh-canvas');\n  const ctx = canvas.getContext('2d');\n  let W, H, nodes = [], animId;\n\n  const RED = 'oklch(48% 0.22 25)';\n  const RED_DIM = 'oklch(35% 0.18 25 / 0.4)';\n  const WHITE_DIM = 'oklch(95% 0.004 60 / 0.12)';\n\n  function resize() {\n    W = canvas.width = canvas.offsetWidth;\n    H = canvas.height = canvas.offsetHeight;\n    initNodes();\n  }\n\n  function initNodes() {\n    nodes = [];\n    const count = Math.floor((W * H) / 18000);\n    for (let i = 0; i < count; i++) {\n      nodes.push({\n        x: Math.random() * W,\n        y: Math.random() * H,\n        vx: (Math.random() - 0.5) * 0.4,\n        vy: (Math.random() - 0.5) * 0.4,\n        r: Math.random() * 1.5 + 1,\n        pulse: Math.random() * Math.PI * 2,\n        isRed: Math.random() < 0.15\n      });\n    }\n  }\n\n  function draw() {\n    ctx.clearRect(0, 0, W, H);\n\n    // Background vignette\n    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);\n    grad.addColorStop(0, 'transparent');\n    grad.addColorStop(1, 'oklch(4% 0.008 0 / 0.6)');\n    ctx.fillStyle = grad;\n    ctx.fillRect(0, 0, W, H);\n\n    const t = Date.now() * 0.001;\n\n    // Draw edges\n    for (let i = 0; i < nodes.length; i++) {\n      for (let j = i + 1; j < nodes.length; j++) {\n        const dx = nodes[i].x - nodes[j].x;\n        const dy = nodes[i].y - nodes[j].y;\n        const dist = Math.sqrt(dx*dx + dy*dy);\n        const maxDist = 160;\n        if (dist < maxDist) {\n          const alpha = (1 - dist / maxDist) * 0.35;\n          const isSpecial = nodes[i].isRed || nodes[j].isRed;\n          ctx.beginPath();\n          ctx.moveTo(nodes[i].x, nodes[i].y);\n          ctx.lineTo(nodes[j].x, nodes[j].y);\n          if (isSpecial) {\n            ctx.strokeStyle = `oklch(48% 0.22 25 / ${alpha * 0.8})`;\n            ctx.lineWidth = 0.8;\n          } else {\n            ctx.strokeStyle = `oklch(60% 0.005 60 / ${alpha})`;\n            ctx.lineWidth = 0.5;\n          }\n          ctx.stroke();\n        }\n      }\n    }\n\n    // Draw nodes\n    for (let n of nodes) {\n      n.pulse += 0.02;\n      const pulseFactor = Math.sin(n.pulse) * 0.5 + 0.5;\n\n      if (n.isRed) {\n        // Glow ring\n        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 20 + pulseFactor * 12);\n        g.addColorStop(0, `oklch(48% 0.22 25 / 0.3)`);\n        g.addColorStop(1, 'transparent');\n        ctx.fillStyle = g;\n        ctx.beginPath();\n        ctx.arc(n.x, n.y, 20 + pulseFactor * 12, 0, Math.PI * 2);\n        ctx.fill();\n\n        ctx.fillStyle = `oklch(${58 + pulseFactor * 10}% 0.24 22)`;\n        ctx.beginPath();\n        ctx.arc(n.x, n.y, n.r * 1.8, 0, Math.PI * 2);\n        ctx.fill();\n      } else {\n        ctx.fillStyle = `oklch(70% 0.005 60 / ${0.3 + pulseFactor * 0.2})`;\n        ctx.beginPath();\n        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);\n        ctx.fill();\n      }\n\n      n.x += n.vx;\n      n.y += n.vy;\n      if (n.x < 0 || n.x > W) n.vx *= -1;\n      if (n.y < 0 || n.y > H) n.vy *= -1;\n    }\n\n    animId = requestAnimationFrame(draw);\n  }\n\n  window.addEventListener('resize', resize);\n  resize();\n  draw();\n})();\n\n// ── SCROLL REVEALS ─────────────────────────────────────────────────────────\n(function() {\n  const els = document.querySelectorAll('.reveal');\n  const obs = new IntersectionObserver((entries) => {\n    entries.forEach(e => {\n      if (e.isIntersecting) {\n        e.target.classList.add('visible');\n        obs.unobserve(e.target);\n      }\n    });\n  }, { threshold: 0.1 });\n  els.forEach(el => obs.observe(el));\n\n  // Immediately reveal hero\n  document.querySelectorAll('#hero .reveal').forEach(el => {\n    el.classList.add('visible');\n  });\n})();\n\n// ── TERMINAL TABS ──────────────────────────────────────────────────────────\n(function() {\n  const tabs = document.querySelectorAll('.terminal-tab');\n  const contents = document.querySelectorAll('.terminal-content');\n  const copyBtn = document.getElementById('copy-btn');\n\n  tabs.forEach(tab => {\n    tab.addEventListener('click', () => {\n      tabs.forEach(t => t.classList.remove('active'));\n      contents.forEach(c => c.classList.remove('active'));\n      tab.classList.add('active');\n      const id = 'tab-' + tab.dataset.tab;\n      document.getElementById(id).classList.add('active');\n      copyBtn.textContent = 'Copy';\n      copyBtn.classList.remove('copied');\n    });\n  });\n\n  copyBtn.addEventListener('click', () => {\n    const active = document.querySelector('.terminal-content.active');\n    const text = [...active.querySelectorAll('.code-line')]\n      .map(line => {\n        const prompt = line.querySelector('.prompt');\n        const parts = [...line.children].filter(c => !c.classList.contains('prompt'));\n        if (!prompt) return '';\n        return parts.map(p => p.textContent).join('').trim();\n      })\n      .filter(Boolean)\n      .join('\\n');\n\n    navigator.clipboard.writeText(text).then(() => {\n      copyBtn.textContent = 'Copied!';\n      copyBtn.classList.add('copied');\n      setTimeout(() => {\n        copyBtn.textContent = 'Copy';\n        copyBtn.classList.remove('copied');\n      }, 2000);\n    }).catch(() => {\n      copyBtn.textContent = 'Copy';\n    });\n  });\n})();\n\n// ── ARCH TABS ─────────────────────────────────────────────────────────────\n(function() {\n  const tabs = document.querySelectorAll('.arch-tab');\n  const panels = document.querySelectorAll('.arch-panel');\n  tabs.forEach(tab => {\n    tab.addEventListener('click', () => {\n      tabs.forEach(t => t.classList.remove('active'));\n      panels.forEach(p => p.classList.remove('active'));\n      tab.classList.add('active');\n      document.getElementById('arch-' + tab.dataset.arch).classList.add('active');\n    });\n  });\n})();\n\n// ── NAV SCROLL EFFECT ──────────────────────────────────────────────────────\n(function() {\n  const nav = document.querySelector('nav');\n  window.addEventListener('scroll', () => {\n    if (window.scrollY > 80) {\n      nav.style.background = 'oklch(4% 0.008 0 / 0.97)';\n    } else {\n      nav.style.background = 'linear-gradient(to bottom, oklch(4% 0.008 0 / 0.95), transparent)';\n    }\n  });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
