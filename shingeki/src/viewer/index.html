<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進撃 Shingeki — Hub viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+JP:wght@600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #060608;
      --bg: #0c0c10;
      --surface: #12121a;
      --surface-hover: #181822;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #f4f3f0;
      --muted: #8b8b9a;
      --accent: #e24a3b;
      --accent-glow: rgba(226, 74, 59, 0.35);
      --accent-soft: rgba(226, 74, 59, 0.12);
      --green: #34d399;
      --green-dim: rgba(52, 211, 153, 0.15);
      --yellow: #fbbf24;
      --red: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --font-sans: 'Outfit', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
      --font-jp: 'Noto Serif JP', serif;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Atmospheric background */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 120% 80% at 100% -20%, rgba(226, 74, 59, 0.09), transparent 50%),
        radial-gradient(ellipse 80% 60% at -10% 100%, rgba(80, 60, 120, 0.06), transparent 45%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 40%, #08080c 100%);
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, black 20%, transparent 70%);
      pointer-events: none;
    }

    .app-shell {
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      padding-bottom: 4rem;
    }

    header.site-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem 1.5rem;
      margin-bottom: 2rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    header.site-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: min(180px, 40%);
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
    }

    .brand {
      flex: 1;
      min-width: min(100%, 280px);
    }
    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .brand-title .jp {
      font-family: var(--font-jp);
      font-size: clamp(1.75rem, 4vw, 2.15rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #fff 0%, #c8c8d0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-title .en {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .subtitle {
      margin-top: 0.35rem;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 400;
    }

    #status {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--muted);
      transition: border-color 0.25s, color 0.25s, box-shadow 0.25s;
      white-space: nowrap;
    }
    #status.ok {
      color: var(--green);
      border-color: rgba(52, 211, 153, 0.35);
      box-shadow: 0 0 20px var(--green-dim);
      animation: pulse-soft 3s ease-in-out infinite;
    }
    #status.err {
      color: var(--red);
      border-color: rgba(248, 113, 113, 0.4);
      animation: none;
    }
    @keyframes pulse-soft {
      0%, 100% { box-shadow: 0 0 12px var(--green-dim); }
      50% { box-shadow: 0 0 22px rgba(52, 211, 153, 0.22); }
    }

    /* Tab bar */
    .tab-bar-wrap {
      margin-bottom: 2rem;
    }
    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.35rem;
      border-radius: calc(var(--radius) + 4px);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .tab {
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.55rem 1.15rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s, background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .tab:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }
    .tab:active {
      transform: scale(0.98);
    }
    .tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tab.active {
      color: var(--text);
      background: linear-gradient(165deg, rgba(226, 74, 59, 0.18) 0%, rgba(24, 24, 34, 0.95) 100%);
      border-color: rgba(226, 74, 59, 0.45);
      box-shadow: 0 0 24px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    main { min-height: 42vh; }

    .panel {
      display: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .panel.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .panel-inner {
      animation: panel-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.5rem;
      transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }
    .card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .card.latest {
      border-color: rgba(226, 74, 59, 0.5);
      box-shadow: 0 0 0 1px var(--accent-soft), 0 8px 32px var(--accent-glow);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.875rem;
      flex-wrap: wrap;
    }
    .genome-id {
      font-size: 0.88rem;
      font-weight: 600;
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }
    .badge {
      font-size: 0.62rem;
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-tee    { background: rgba(52, 211, 153, 0.12); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.35); }
    .badge-latest { background: var(--accent-soft); color: #ff9a8e; border: 1px solid rgba(226, 74, 59, 0.35); }
    .badge-mutated{ background: rgba(251, 191, 36, 0.1); color: var(--yellow); border: 1px solid rgba(251, 191, 36, 0.35); }
    .badge-origin { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border); }

    .meta {
      font-size: 0.74rem;
      color: var(--muted);
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .score-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .score-label { font-size: 0.72rem; color: var(--muted); min-width: 3.5rem; font-weight: 500; }
    .score-bar {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      overflow: hidden;
    }
    .score-fill { height: 100%; border-radius: 6px; transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1); }
    .score-val  { font-size: 0.75rem; font-weight: 700; font-family: var(--font-mono); min-width: 2.75rem; text-align: right; }

    .connector {
      width: 2px;
      height: 2rem;
      background: linear-gradient(180deg, rgba(226, 74, 59, 0.5), rgba(255,255,255,0.08));
      border-radius: 2px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: clamp(3rem, 12vw, 5rem) 1.5rem;
      font-size: 0.92rem;
      line-height: 1.85;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.2);
    }
    .empty code {
      font-family: var(--font-mono);
      font-size: 0.82em;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
    }

    .task-wrap { max-width: 720px; margin: 0 auto; }

    .task-followup {
      margin-top: 2rem;
      padding: 1.35rem 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }
    .task-followup[hidden] { display: none !important; }
    .task-followup h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 0.9rem;
      font-weight: 700;
    }
    .task-followup .field { margin-bottom: 1rem; }
    .task-followup label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .task-followup textarea {
      width: 100%;
      min-height: 5.5rem;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      line-height: 1.5;
      resize: vertical;
    }
    .task-followup textarea:focus-visible {
      outline: none;
      border-color: rgba(226, 74, 59, 0.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .task-followup .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .task-followup label.inline {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: normal;
      color: var(--text);
      cursor: pointer;
    }
    /* Follow-up button — identical treatment to .run-form button.primary */
    .task-followup button.primary {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 0.7rem 1.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(226, 74, 59, 0.6);
      background: linear-gradient(180deg, #e85545 0%, #c73e32 50%, #a33228 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .task-followup button.primary:hover {
      filter: brightness(1.07);
      box-shadow: 0 6px 28px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .task-followup button.primary:active { transform: translateY(1px); }
    .task-followup button.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .task-followup button.primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; filter: none; }

    /* Also ensure run-form button uses inline-flex for spinner support */
    .run-form button.primary { display: inline-flex; align-items: center; gap: 0.5rem; }

    /* Button spinner */
    @keyframes btn-spin { to { transform: rotate(360deg); } }
    .btn-spinner {
      width: 0.85em;
      height: 0.85em;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      border-radius: 50%;
      animation: btn-spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    /* Skeleton loader */
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .skeleton-panel { padding: 0.25rem 0; }
    .skel-line {
      border-radius: 6px;
      margin-bottom: 0.65rem;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.09) 50%,
        rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    .skel-line.h1  { height: 1.6rem; width: 55%; margin-bottom: 1.1rem; }
    .skel-line.h2  { height: 1.15rem; width: 38%; margin-bottom: 0.85rem; }
    .skel-line.p   { height: 0.85rem; }
    .skel-line.p.w100 { width: 100%; }
    .skel-line.p.w85  { width: 85%; }
    .skel-line.p.w70  { width: 70%; }
    .skel-line.p.w50  { width: 50%; }
    .skel-block {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 1.1rem 1.25rem;
      margin-bottom: 0.85rem;
    }

    #followup-feedback {
      margin-top: 0.35rem;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      display: none;
      line-height: 1.5;
    }
    #followup-feedback.visible { display: block; }
    #followup-feedback.ok {
      border: 1px solid rgba(52, 211, 153, 0.35);
      background: rgba(52, 211, 153, 0.08);
      color: var(--green);
    }
    #followup-feedback.err {
      border: 1px solid rgba(248, 113, 113, 0.45);
      background: rgba(248, 113, 113, 0.08);
      color: #fecaca;
    }

    .task-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .task-toolbar label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    select.input,
    .task-toolbar select {
      flex: 1;
      min-width: 12rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select.input:focus-visible,
    .task-toolbar select:focus-visible {
      outline: none;
      border-color: rgba(226, 74, 59, 0.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .task-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      font-family: var(--font-mono);
    }
    .task-meta strong { color: var(--text); font-weight: 500; }

    .task-summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid rgba(226, 74, 59, 0.65);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }
    /* Section chrome — only the “Final summary” label, not Markdown headings inside */
    .task-summary > h2 {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 700;
    }

    /* Markdown / readme-style prose (summary + step outputs) */
    .md-content {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--text);
      word-break: break-word;
      overflow-x: auto;
    }
    .md-content > *:first-child { margin-top: 0 !important; }
    .md-content > *:last-child { margin-bottom: 0 !important; }
    .md-content h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 1.15rem 0 0.55rem;
      letter-spacing: -0.02em;
      line-height: 1.25;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border-strong);
      color: var(--text);
    }
    .md-content h2 {
      font-size: 1.12rem;
      font-weight: 700;
      margin: 1rem 0 0.45rem;
      letter-spacing: -0.01em;
      color: #eae9e6;
    }
    .md-content h3 {
      font-size: 1rem;
      font-weight: 650;
      margin: 0.85rem 0 0.4rem;
      color: #e8e7e4;
    }
    .md-content h4, .md-content h5, .md-content h6 {
      font-size: 0.92rem;
      font-weight: 600;
      margin: 0.75rem 0 0.35rem;
      color: var(--muted);
    }
    .md-content p { margin: 0.55rem 0; }
    .md-content ul, .md-content ol {
      margin: 0.55rem 0;
      padding-left: 1.35rem;
    }
    .md-content li { margin: 0.25rem 0; }
    .md-content li > p { margin: 0.2rem 0; }
    .md-content blockquote {
      margin: 0.75rem 0;
      padding: 0.5rem 0 0.5rem 1rem;
      border-left: 3px solid rgba(226, 74, 59, 0.55);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--muted);
    }
    .md-content blockquote p { margin: 0.35rem 0; }
    .md-content hr {
      border: none;
      border-top: 1px solid var(--border-strong);
      margin: 1.15rem 0;
    }
    .md-content a {
      color: #ff8a7a;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .md-content a:hover { color: #ffb8ae; }
    .md-content strong { font-weight: 700; color: var(--text); }
    .md-content em { font-style: italic; color: #dddcd8; }
    .md-content code {
      font-family: var(--font-mono);
      font-size: 0.84em;
      padding: 0.15em 0.45em;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .md-content pre {
      margin: 0.75rem 0;
      padding: 1rem 1.1rem;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.55;
      color: #d6d4ce;
    }
    .md-content pre code {
      padding: 0;
      border: none;
      background: none;
      font-size: inherit;
    }
    .md-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.75rem 0;
      font-size: 0.86rem;
    }
    .md-content th, .md-content td {
      border: 1px solid var(--border-strong);
      padding: 0.5rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .md-content th {
      background: rgba(255, 255, 255, 0.05);
      font-weight: 600;
      color: var(--text);
    }
    .md-content tr:nth-child(even) td { background: rgba(0, 0, 0, 0.15); }
    .md-fallback {
      margin: 0;
      padding: 1rem;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d6d4ce;
    }

    .steps-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 0.85rem;
      font-weight: 700;
    }

    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.1rem 1.25rem;
      margin-bottom: 0.85rem;
      transition: border-color 0.2s;
    }
    .step-card:hover {
      border-color: var(--border-strong);
    }
    .step-card h3 {
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
      font-family: var(--font-mono);
      color: var(--text);
    }
    .step-card .sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
      font-family: var(--font-mono);
    }
    .step-card .step-output-md {
      margin-top: 0.35rem;
    }

    .run-form { max-width: 640px; margin: 0 auto; }
    .run-form .field { margin-bottom: 1.25rem; }
    .run-form label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    .run-form textarea,
    .run-form input[type="text"] {
      width: 100%;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .run-form textarea:focus-visible,
    .run-form input[type="text"]:focus-visible {
      outline: none;
      border-color: rgba(226, 74, 59, 0.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .run-form textarea { min-height: 8.5rem; resize: vertical; line-height: 1.55; }

    .run-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: flex-end;
    }
    .run-row label.inline {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.88rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: normal;
      color: var(--text);
      cursor: pointer;
      padding: 0.5rem 0;
    }
    .run-row input[type="checkbox"] {
      width: 1.05rem;
      height: 1.05rem;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .run-form select {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      min-width: 10rem;
      cursor: pointer;
    }
    #run-resume-select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .run-form button.primary {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 0.7rem 1.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(226, 74, 59, 0.6);
      background: linear-gradient(180deg, #e85545 0%, #c73e32 50%, #a33228 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }
    .run-form button.primary:hover {
      filter: brightness(1.06);
      box-shadow: 0 6px 28px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .run-form button.primary:active {
      transform: translateY(1px);
    }
    .run-form button.primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .run-form button.primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .run-hint {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.65;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .run-hint code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      padding: 0.12em 0.35em;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
    }

    #run-feedback {
      margin-bottom: 1.25rem;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      display: none;
      line-height: 1.55;
      animation: feedback-in 0.35s ease both;
    }
    @keyframes feedback-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
    #run-feedback.visible { display: block; }
    #run-feedback.ok {
      border: 1px solid rgba(52, 211, 153, 0.35);
      background: rgba(52, 211, 153, 0.08);
      color: var(--green);
    }
    #run-feedback.err {
      border: 1px solid rgba(248, 113, 113, 0.45);
      background: rgba(248, 113, 113, 0.08);
      color: #fecaca;
    }

    /* ── Tab badge ── */
    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.35em;
      height: 1.35em;
      padding: 0 0.35em;
      border-radius: 999px;
      background: rgba(226, 74, 59, 0.22);
      color: #ff9a8e;
      font-size: 0.68em;
      font-weight: 700;
      margin-left: 0.5em;
      line-height: 1;
      vertical-align: middle;
    }

    /* ── Node preview chips (run form) ── */
    .node-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      min-height: 1.6rem;
      margin-top: 0.55rem;
    }
    .node-chip {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .node-chip.research { border-color: rgba(52,211,153,0.45); color: var(--green); background: rgba(52,211,153,0.07); }
    .node-chip.planning  { border-color: rgba(251,191,36,0.45);  color: var(--yellow); background: rgba(251,191,36,0.07); }
    .node-chip.coding    { border-color: rgba(147,129,255,0.45); color: #a78bfa;       background: rgba(147,129,255,0.07); }
    .node-chip.general   { border-color: var(--border-strong);   color: var(--muted); }
    .node-preview-label  { font-size: 0.7rem; color: var(--muted); align-self: center; }

    /* ── Running banner ── */
    .running-banner {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(52, 211, 153, 0.35);
      background: rgba(52, 211, 153, 0.06);
      margin-bottom: 1.25rem;
      animation: feedback-in 0.35s ease both;
    }
    .running-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      margin-top: 0.45rem;
      animation: blink-dot 1.3s ease-in-out infinite;
    }
    @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .running-text { font-size: 0.88rem; color: var(--green); font-weight: 600; }
    .running-sub  { font-size: 0.74rem; color: var(--muted); margin-top: 0.15rem; font-family: var(--font-mono); }

    .run-help {
      text-align: left;
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--muted);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.28);
      padding: 0.85rem 1rem;
      margin-bottom: 1.15rem;
    }
    .run-help p { margin: 0 0 0.6rem; }
    .run-help p:last-child { margin-bottom: 0; }
    .run-help code { font-family: var(--font-mono); font-size: 0.78em; }

    /* ── Final answer card ── */
    .final-answer-card {
      background: var(--surface);
      border: 1px solid rgba(226, 74, 59, 0.45);
      border-radius: var(--radius);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 0 1px var(--accent-soft), 0 6px 28px var(--accent-glow);
    }
    .final-answer-card > .section-label { margin: 0 0 1rem; }

    /* ── Step eval row ── */
    .step-eval {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.75rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .eval-label { font-size: 0.7rem; color: var(--muted); font-weight: 500; }
    .eval-bar { flex: 1; min-width: 60px; height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
    .eval-fill { height: 100%; border-radius: 4px; transition: width 0.55s ease; }
    .eval-val  { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; min-width: 2.4rem; text-align: right; }
    .badge-heuristic { background: rgba(255,255,255,0.05); color: var(--muted);  border: 1px solid var(--border); }
    .badge-llm       { background: rgba(226,74,59,0.1);     color: #ff8a7a;      border: 1px solid rgba(226,74,59,0.3); }

    /* ── Section label (shared) ── */
    .section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 700;
      display: block;
    }
    .section-label.accent { color: #ff9a8e; }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="site-header">
      <div class="brand">
        <div class="brand-title">
          <span class="jp">進撃</span>
          <span class="en">Shingeki</span>
        </div>
        <p class="subtitle">Genome lineage &amp; task checkpoints</p>
      </div>
      <span id="status">connecting…</span>
    </header>

    <div class="tab-bar-wrap">
      <nav class="tab-bar" role="tablist" aria-label="Viewer sections">
        <button type="button" class="tab active" id="tab-lineage" role="tab" aria-selected="true" aria-controls="panel-lineage">Genome lineage</button>
        <button type="button" class="tab" id="tab-run" role="tab" aria-selected="false" aria-controls="panel-run">Run task</button>
        <button type="button" class="tab" id="tab-tasks" role="tab" aria-selected="false" aria-controls="panel-tasks">Task results<span id="tasks-badge" class="tab-badge" hidden></span></button>
      </nav>
    </div>

    <main>
      <div id="panel-lineage" class="panel visible" role="tabpanel" aria-labelledby="tab-lineage">
        <div class="panel-inner">
          <div id="tree"></div>
        </div>
      </div>

      <div id="panel-run" class="panel" role="tabpanel" aria-labelledby="tab-run" hidden>
        <div class="panel-inner">
          <div id="run-feedback" role="status"></div>
          <form class="run-form" id="run-form" autocomplete="off">
            <div class="field">
              <label for="run-task-text">Task <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional — leave blank to use the preset goal below)</span></label>
              <textarea id="run-task-text" name="task" placeholder="e.g. Research ZK proofs on Ethereum; compare gas costs; recommend one for a new DEX"></textarea>
              <div id="run-node-preview" class="node-preview" aria-live="polite"></div>
            </div>
            <div class="field run-row">
              <div>
                <label for="run-preset">Preset</label>
                <select id="run-preset" name="preset" class="input">
                  <option value="gpu" selected>GPU research</option>
                  <option value="japan">Japan trip</option>
                </select>
              </div>
              <label class="inline"><input type="checkbox" id="run-mesh" name="mesh" /> Distributed mesh (needs workers on this hub)</label>
            </div>
            <div class="field">
              <label for="run-resume-select">Resume from checkpoint (optional)</label>
              <select id="run-resume-select" name="resume" class="input" aria-label="Resume from saved checkpoint">
                <option value="">— New run —</option>
              </select>
            </div>
            <button type="submit" class="primary" id="run-submit">Start run</button>
            <p class="run-hint">Runs the same CLI as <code>npm run run</code> on the hub machine — Router / wallet keys stay in <code>.env</code> only. Mesh mode needs workers on this hub.</p>
          </form>
        </div>
      </div>

      <div id="panel-tasks" class="panel" role="tabpanel" aria-labelledby="tab-tasks" hidden>
        <div class="panel-inner">
          <div class="task-wrap">
            <div class="task-toolbar">
              <label for="task-select">Checkpoint</label>
              <select id="task-select" class="input" aria-label="Select task checkpoint"></select>
            </div>
            <div id="task-body"></div>
            <div id="followup-feedback" role="status" aria-live="polite"></div>
            <div id="task-followup" class="task-followup" hidden>
              <h3>Follow-up task</h3>
              <p class="run-hint" style="margin: -0.25rem 0 1rem; border: none; padding: 0">
                Starts a <strong>new</strong> run. Optional: include the result above as context for the model.
              </p>
              <form id="followup-form" autocomplete="off">
                <div class="field">
                  <label for="followup-text">What should happen next?</label>
                  <textarea id="followup-text" placeholder="e.g. Add a section on cost; refine strategy 2; fix the table…"></textarea>
                </div>
                <div class="field">
                  <label class="inline">
                    <input type="checkbox" id="followup-include" checked />
                    Include this checkpoint’s summary &amp; step outputs in the prompt (readme-style context)
                  </label>
                </div>
                <div class="field">
                  <label class="inline">
                    <input type="checkbox" id="followup-resume" />
                    Continue this checkpoint (<code>--resume</code>) — uses this task’s preset &amp; mesh
                  </label>
                </div>
                <div class="row">
                  <div>
                    <label for="followup-preset">Preset</label>
                    <select id="followup-preset" class="input">
                      <option value="gpu">GPU research</option>
                      <option value="japan">Japan trip</option>
                    </select>
                  </div>
                  <label class="inline"><input type="checkbox" id="followup-mesh" /> Distributed mesh</label>
                </div>
                <button type="submit" class="primary" id="followup-submit">Run follow-up</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" crossorigin="anonymous"></script>
  <script>
    const tree = document.getElementById('tree');
    const statusEl = document.getElementById('status');
    const tabLineage = document.getElementById('tab-lineage');
    const tabRun = document.getElementById('tab-run');
    const tabTasks = document.getElementById('tab-tasks');
    const panelLineage = document.getElementById('panel-lineage');
    const panelRun = document.getElementById('panel-run');
    const panelTasks = document.getElementById('panel-tasks');
    const taskSelect = document.getElementById('task-select');
    const taskBody = document.getElementById('task-body');
    const taskFollowup = document.getElementById('task-followup');
    const followupForm = document.getElementById('followup-form');
    const followupText = document.getElementById('followup-text');
    const followupInclude = document.getElementById('followup-include');
    const followupResume = document.getElementById('followup-resume');
    const followupPreset = document.getElementById('followup-preset');
    const followupMesh = document.getElementById('followup-mesh');
    const followupFeedback = document.getElementById('followup-feedback');
    const followupSubmit = document.getElementById('followup-submit');
    const runForm = document.getElementById('run-form');
    const runFeedback = document.getElementById('run-feedback');
    const runSubmit = document.getElementById('run-submit');

    let lastLineageHash = '';
    let checkpointsCache = [];
    let selectedTaskId = null;
    let checkpointDetail = null;
    /** Task id from last POST /api/run until it appears in /checkpoints (avoids dropping selection + confusing errors). */
    let pendingRunTaskId = null;
    /** Sync preset/mesh defaults when the selected checkpoint changes (does not clear follow-up text). */
    let lastFollowUpSyncedTaskId = null;

    const PENDING_RUN_META_KEY = 'shingeki_pendingRun';
    function savePendingRunMeta(taskId, mesh) {
      try {
        sessionStorage.setItem(
          PENDING_RUN_META_KEY,
          JSON.stringify({ taskId, mesh: !!mesh, at: Date.now() }),
        );
      } catch (_) {}
    }
    function clearPendingRunMeta() {
      try {
        sessionStorage.removeItem(PENDING_RUN_META_KEY);
      } catch (_) {}
    }
    function getPendingRunMeta() {
      try {
        const s = sessionStorage.getItem(PENDING_RUN_META_KEY);
        if (!s) return null;
        const o = JSON.parse(s);
        if (!o || typeof o.taskId !== 'string') return null;
        return { taskId: o.taskId, mesh: !!o.mesh, at: Number(o.at) || 0 };
      } catch {
        return null;
      }
    }
    /** Extra hints while waiting (mesh needs workers; long wait may mean crashed child). */
    function pendingRunHelpHtml() {
      const meta = getPendingRunMeta();
      if (!pendingRunTaskId || !meta || meta.taskId !== pendingRunTaskId) return '';
      const parts = [];
      if (meta.mesh) {
        parts.push(
          '<strong>Distributed mesh</strong> is on: the run waits for <strong>at least two workers</strong> on this hub. Open extra terminals and run e.g. <code>NODE_ID=node-1 npm run node</code> and <code>NODE_ID=node-2 npm run node</code> (same machine / hub URL). Otherwise turn off <strong>Distributed mesh</strong> on <strong>Run task</strong> for local execution.',
        );
      } else {
        parts.push(
          'Local run (no mesh): first step calls Router — ensure <code>ROUTER_API_KEY</code> is set where <code>npm run hub</code> runs.',
        );
      }
      const age = Date.now() - meta.at;
      if (age > 120_000) {
        parts.push(
          'Still no checkpoint after ~2 minutes? The CLI may have exited (timeout, missing workers, Router error). Restart the hub with <code>SHINGEKI_HUB_LOG_CHILD_RUN=1 npm run hub</code> to print run logs in that terminal.',
        );
      }
      return `<div class="run-help">${parts.map(p => `<p>${p}</p>`).join('')}</div>`;
    }

    // ── Node preview (mirrors splitCompoundTask domain inference) ──────────────
    const _CODING_RE   = /\b(code|implement|build|write|debug|fix|refactor|deploy|program|develop)\b/i;
    const _RESEARCH_RE = /\b(search|find|gather|research|look\s*up|fetch|investigate|survey|explore|discover)\b/i;
    const _PLANNING_RE = /\b(plan|compare|decide|choose|recommend|select|evaluate|strategize|assess|analyse|analyze)\b/i;

    function inferDomainJs(text) {
      if (_CODING_RE.test(text))   return 'coding';
      if (_RESEARCH_RE.test(text)) return 'research';
      if (_PLANNING_RE.test(text)) return 'planning';
      return 'general';
    }

    function previewNodes(taskText) {
      const text = taskText.trim();
      if (!text) return null;
      const compound = text.includes(';') || /\bthen\b/i.test(text) || /\bsteps:/i.test(text);
      const parts = compound ? text.split(/;|\bthen\b/i).map(s => s.trim()).filter(Boolean) : [text];
      const counts = {};
      for (const p of parts) { const d = inferDomainJs(p); counts[d] = (counts[d] ?? 0) + 1; }
      const result = {};
      for (const [d, n] of Object.entries(counts)) result[d] = Math.min(n, 2);
      const total = Object.values(result).reduce((a, b) => a + b, 0);
      if (total < 2) { const first = Object.keys(result)[0] ?? 'general'; result[first] = 2; }
      return result;
    }

    function renderNodePreview(taskText) {
      const el = document.getElementById('run-node-preview');
      if (!el) return;
      const nodes = previewNodes(taskText);
      if (!nodes) { el.innerHTML = ''; return; }
      const total = Object.values(nodes).reduce((a, b) => a + b, 0);
      const chips = Object.entries(nodes).map(([d, n]) =>
        `<span class="node-chip ${d}">${n}× ${d}</span>`).join('');
      el.innerHTML = `<span class="node-preview-label">will spawn ${total} node${total !== 1 ? 's' : ''}:</span>${chips}`;
    }

    document.getElementById('run-task-text').addEventListener('input', e => {
      renderNodePreview(e.target.value);
    });

    tabLineage.addEventListener('click', () => setTab('lineage'));
    tabRun.addEventListener('click', () => setTab('run'));
    tabTasks.addEventListener('click', () => {
      setTab('tasks');
      // If the task panel still shows the initial skeleton (no data yet), kick off a fresh poll
      if (!checkpointsCache.length && !checkpointDetail) poll();
    });

    function setTab(which) {
      const onLineage = which === 'lineage';
      const onRun = which === 'run';
      const onTasks = which === 'tasks';
      tabLineage.classList.toggle('active', onLineage);
      tabRun.classList.toggle('active', onRun);
      tabTasks.classList.toggle('active', onTasks);
      tabLineage.setAttribute('aria-selected', onLineage);
      tabRun.setAttribute('aria-selected', onRun);
      tabTasks.setAttribute('aria-selected', onTasks);
      panelLineage.classList.toggle('visible', onLineage);
      panelRun.classList.toggle('visible', onRun);
      panelTasks.classList.toggle('visible', onTasks);
      panelLineage.hidden = !onLineage;
      panelRun.hidden = !onRun;
      panelTasks.hidden = !onTasks;
    }

    function showRunFeedback(ok, text) {
      runFeedback.textContent = text;
      runFeedback.className = ok ? 'visible ok' : 'visible err';
    }

    function hideRunFeedback() {
      runFeedback.className = '';
      runFeedback.textContent = '';
    }

    function showFollowupFeedback(ok, text) {
      followupFeedback.textContent = text;
      followupFeedback.className = 'visible ' + (ok ? 'ok' : 'err');
    }

    function hideFollowupFeedback() {
      followupFeedback.className = '';
      followupFeedback.textContent = '';
    }

    /** Must match `VIEWER_FOLLOWUP_SEPARATOR` in `src/orchestrator/planner.ts` (planner single-step guard). */
    const FOLLOWUP_TASK_SEP = '\n\n---\n\n**Follow-up:**\n\n';

    /** Prior summary + steps for the next run’s `--task` text (truncated). */
    function buildFollowUpContext(cp) {
      const lines = [];
      lines.push('## Prior run: `' + String(cp.taskId) + '`');
      lines.push('');
      lines.push('### Summary');
      lines.push(String(cp.summary || '').trim() || '(none)');
      lines.push('');
      lines.push('### Step outputs');
      for (const r of cp.results || []) {
        lines.push('');
        lines.push('#### ' + String(r.stepId));
        lines.push(String(r.output || '').trim() || '(empty)');
      }
      let text = lines.join('\n');
      const max = 12000;
      if (text.length > max) {
        text = text.slice(0, max) + '\n\n…(truncated)';
      }
      return text;
    }

    function setFollowupResumeMode(on) {
      const cp = checkpointDetail;
      const lock = on && !!cp;
      followupPreset.disabled = lock;
      followupMesh.disabled = lock;
      if (lock && cp) {
        followupPreset.value = cp.preset === 'japan' ? 'japan' : 'gpu';
        followupMesh.checked = !!cp.mesh;
      }
    }

    function refreshFollowUpPanel() {
      const cp = checkpointDetail;
      const canShow = !!cp && checkpointsCache.length > 0;
      taskFollowup.hidden = !canShow;
      if (!canShow || !cp) return;
      if (lastFollowUpSyncedTaskId !== cp.taskId) {
        lastFollowUpSyncedTaskId = cp.taskId;
        followupPreset.value = cp.preset === 'japan' ? 'japan' : 'gpu';
        followupMesh.checked = !!cp.mesh;
      }
      setFollowupResumeMode(followupResume.checked);
    }

    followupResume.addEventListener('change', () => setFollowupResumeMode(followupResume.checked));

    followupForm.addEventListener('submit', async ev => {
      ev.preventDefault();
      hideFollowupFeedback();
      const cp = checkpointDetail;
      if (!cp) {
        showFollowupFeedback(false, 'No checkpoint loaded — select a task above.');
        return;
      }
      const userText = followupText.value.trim();
      if (!userText) {
        showFollowupFeedback(false, 'Describe what should happen next.');
        return;
      }
      let task = userText;
      if (followupInclude.checked) {
        task = buildFollowUpContext(cp) + FOLLOWUP_TASK_SEP + userText;
      }
      const resume = followupResume.checked;
      const preset = resume ? (cp.preset === 'japan' ? 'japan' : 'gpu') : followupPreset.value;
      const mesh = resume ? !!cp.mesh : followupMesh.checked;
      const headers = { 'Content-Type': 'application/json' };
      const body = { preset, mesh };
      if (task) body.task = task;
      if (resume) body.resume = cp.taskId;

      setButtonLoading(followupSubmit, true);
      try {
        const res = await fetch('/api/run', { method: 'POST', headers, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (res.status === 202 && data.accepted && data.taskId) {
          pendingRunTaskId = data.taskId;
          savePendingRunMeta(data.taskId, mesh);
          selectedTaskId = data.taskId;
          checkpointDetail = null;
          fillTaskSelect();
          setTab('tasks');
          taskBody.innerHTML = skeletonPanel();
          followupText.value = '';
          showFollowupFeedback(
            true,
            'Follow-up run started — task id ' + data.taskId + '. First step output appears in the area above when ready (often 30–120s). This message stays visible while the run is starting.',
          );
          followupFeedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          poll();
        } else if (res.status === 401) {
          showFollowupFeedback(false, 'Unauthorized — hub requires SHINGEKI_HUB_TOKEN; open the viewer from this machine (localhost) or unset the token for local dev.');
        } else if (res.status === 400 && data.error === 'env') {
          showFollowupFeedback(false, (data.errors || []).join(' ') || 'Environment check failed (e.g. ROUTER_API_KEY).');
        } else if (res.status === 400 && data.error === 'mesh_workers') {
          showFollowupFeedback(false, data.message || 'Not enough mesh workers connected to this hub.');
        } else if (res.status === 404) {
          showFollowupFeedback(
            false,
            data.task
              ? 'Checkpoint not found yet — wait for the run to write its first step, then refresh.'
              : 'Hub route not found — restart `npm run hub` from the shingeki folder (POST /api/run).',
          );
        } else {
          showFollowupFeedback(false, data.error || data.message || ('HTTP ' + res.status));
        }
      } catch (e) {
        showFollowupFeedback(false, e.message || String(e));
      } finally {
        setButtonLoading(followupSubmit, false);
      }
    });

    runForm.addEventListener('submit', async ev => {
      ev.preventDefault();
      hideRunFeedback();
      const task = document.getElementById('run-task-text').value.trim();
      const preset = document.getElementById('run-preset').value;
      const mesh = document.getElementById('run-mesh').checked;
      const resume = document.getElementById('run-resume-select').value.trim();
      const headers = { 'Content-Type': 'application/json' };

      const body = { preset, mesh };
      if (task) body.task = task;
      if (resume) body.resume = resume;

      setButtonLoading(runSubmit, true);
      try {
        const res = await fetch('/api/run', { method: 'POST', headers, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (res.status === 202 && data.accepted && data.taskId) {
          pendingRunTaskId = data.taskId;
          savePendingRunMeta(data.taskId, mesh);
          selectedTaskId = data.taskId;
          checkpointDetail = null;
          fillTaskSelect();
          setTab('tasks');
          taskBody.innerHTML = skeletonPanel();
          taskBody.scrollIntoView({ behavior: 'smooth', block: 'start' });
          hideRunFeedback();
          poll();
        } else if (res.status === 401) {
          showRunFeedback(false, 'Unauthorized — hub requires SHINGEKI_HUB_TOKEN; open the viewer from this machine (localhost) or unset the token for local dev.');
        } else if (res.status === 400 && data.error === 'env') {
          showRunFeedback(false, (data.errors || []).join(' ') || 'Environment check failed (e.g. ROUTER_API_KEY).');
        } else if (res.status === 400 && data.error === 'mesh_workers') {
          showRunFeedback(false, data.message || 'Not enough mesh workers connected to this hub.');
        } else if (res.status === 404) {
          showRunFeedback(
            false,
            data.task
              ? 'Checkpoint not found yet — wait for the run to write its first step, then refresh.'
              : 'Hub route not found — restart `npm run hub` from the shingeki folder (this hub must expose POST /api/run). Open the viewer from the same origin as the hub (e.g. http://127.0.0.1:8765/viewer).',
          );
        } else {
          showRunFeedback(false, data.error || data.message || ('HTTP ' + res.status));
        }
      } catch (e) {
        showRunFeedback(false, e.message || String(e));
      } finally {
        setButtonLoading(runSubmit, false);
      }
    });

    taskSelect.addEventListener('change', async () => {
      selectedTaskId = taskSelect.value || null;
      checkpointDetail = null;
      taskBody.innerHTML = skeletonPanel();
      await fetchCheckpointDetail();
      renderTaskPanel();
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    (function initMarkdown() {
      try {
        if (typeof marked !== 'undefined' && marked.setOptions) {
          marked.setOptions({
            gfm: true,
            breaks: true,
          });
        }
      } catch {
        /* ignore */
      }
    })();

    /** Renders Markdown (readme-style) to safe HTML; falls back to escaped pre if libs missing. */
    function renderMarkdown(src) {
      const raw = String(src ?? '');
      if (!raw.trim()) return '';
      try {
        if (
          typeof marked !== 'undefined' &&
          typeof marked.parse === 'function' &&
          typeof DOMPurify !== 'undefined' &&
          typeof DOMPurify.sanitize === 'function'
        ) {
          const html = marked.parse(raw, { async: false });
          return DOMPurify.sanitize(html);
        }
      } catch (e) {
        console.warn('[viewer] markdown render failed', e);
      }
      return `<pre class="md-fallback">${escapeHtml(raw)}</pre>`;
    }

    function scoreColor(s) {
      if (s >= 0.75) return '#34d399';
      if (s >= 0.55) return '#fbbf24';
      return '#f87171';
    }

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString(undefined, { hour12: false });
    }

    function renderCard(e, isLatest) {
      const s = Math.min(1, Math.max(0, e.fitness_score));
      const pct = (s * 100).toFixed(1);
      const color = scoreColor(s);
      const isRoot = !e.parent_id;

      return `
        <div class="card${isLatest ? ' latest' : ''}">
          <div class="card-header">
            <span class="genome-id">${e.genome_id}</span>
            ${e.tee_verified ? '<span class="badge badge-tee">TEE ✓</span>' : ''}
            ${isLatest    ? '<span class="badge badge-latest">latest</span>' : ''}
            ${!isRoot     ? '<span class="badge badge-mutated">mutated</span>' : '<span class="badge badge-origin">origin</span>'}
          </div>
          <div class="meta">
            <span>model: <strong>${e.model}</strong></span>
            <span>strategy: ${e.strategy}</span>
            <span>steps: ${e.step_count}</span>
            <span>${fmtTime(e.timestamp)}</span>
          </div>
          <div class="score-row">
            <span class="score-label">fitness</span>
            <div class="score-bar">
              <div class="score-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            <span class="score-val" style="color:${color}">${s.toFixed(2)}</span>
          </div>
        </div>`;
    }

    function renderLineage(entries) {
      if (!entries.length) {
        tree.innerHTML = '<div class="empty">No genome mutations recorded yet.<br>Start <code>npm run run -- --mesh</code> to see evolution in action.</div>';
        return;
      }
      const parts = [];
      entries.forEach((e, i) => {
        if (i > 0) parts.push('<div class="connector"></div>');
        parts.push(renderCard(e, i === entries.length - 1));
      });
      tree.innerHTML = parts.join('');
    }

    function ensureTaskSelection() {
      const ids = checkpointsCache.map(c => c.taskId);
      if (pendingRunTaskId && ids.includes(pendingRunTaskId)) {
        pendingRunTaskId = null;
        clearPendingRunMeta();
      }
      if (!ids.length) {
        selectedTaskId = pendingRunTaskId ?? null;
        return;
      }
      if (pendingRunTaskId && !ids.includes(pendingRunTaskId)) {
        selectedTaskId = pendingRunTaskId;
        return;
      }
      if (!selectedTaskId || !ids.includes(selectedTaskId)) {
        selectedTaskId = ids[0];
      }
    }

    function fillTaskSelect() {
      const cur = selectedTaskId;
      taskSelect.innerHTML = '';
      if (pendingRunTaskId && !checkpointsCache.some(c => c.taskId === pendingRunTaskId)) {
        const opt = document.createElement('option');
        opt.value = pendingRunTaskId;
        opt.textContent = `${pendingRunTaskId} · starting…`;
        taskSelect.appendChild(opt);
      }
      for (const c of checkpointsCache) {
        const opt = document.createElement('option');
        opt.value = c.taskId;
        const t = new Date(c.updatedAt).toLocaleString(undefined, { hour12: false });
        const preview = c.summaryPreview ? ` — ${c.summaryPreview.slice(0, 60).replace(/\s+/g, ' ')}…` : '';
        opt.textContent = `${c.taskId} · ${t} · ${c.stepCount}/${c.nextStepIndex} steps${preview}`;
        taskSelect.appendChild(opt);
      }
      const valid =
        cur &&
        (checkpointsCache.some(x => x.taskId === cur) ||
          (pendingRunTaskId && cur === pendingRunTaskId));
      if (valid) {
        taskSelect.value = cur;
      } else if (selectedTaskId && checkpointsCache.some(x => x.taskId === selectedTaskId)) {
        taskSelect.value = selectedTaskId;
      }
    }

    function fillResumeSelect() {
      const sel = document.getElementById('run-resume-select');
      const prev = sel.value;
      sel.innerHTML = '';
      const opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = '— New run —';
      sel.appendChild(opt0);
      for (const c of checkpointsCache) {
        const opt = document.createElement('option');
        opt.value = c.taskId;
        const t = new Date(c.updatedAt).toLocaleString(undefined, { hour12: false });
        opt.textContent = `${c.taskId} · ${t} · ${c.stepCount} step(s)`;
        sel.appendChild(opt);
      }
      if (prev && checkpointsCache.some(x => x.taskId === prev)) {
        sel.value = prev;
      } else {
        sel.value = '';
      }
    }

    async function fetchCheckpointDetail() {
      if (!selectedTaskId) {
        checkpointDetail = null;
        return;
      }
      try {
        const res = await fetch('/checkpoint?task=' + encodeURIComponent(selectedTaskId));
        checkpointDetail = res.ok ? await res.json() : null;
      } catch {
        checkpointDetail = null;
      }
    }

    function skeletonPanel() {
      return `<div class="skeleton-panel">
        <div class="skel-line h1"></div>
        <div class="skel-line h2"></div>
        <div class="skel-line p w100"></div>
        <div class="skel-line p w85"></div>
        <div class="skel-line p w70"></div>
        <div class="skel-block">
          <div class="skel-line h2"></div>
          <div class="skel-line p w100"></div>
          <div class="skel-line p w85"></div>
          <div class="skel-line p w70"></div>
        </div>
        <div class="skel-block">
          <div class="skel-line h2"></div>
          <div class="skel-line p w100"></div>
          <div class="skel-line p w70"></div>
          <div class="skel-line p w50"></div>
        </div>
      </div>`;
    }

    function setButtonLoading(btn, loading) {
      if (loading) {
        btn.dataset.origText = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span>${escapeHtml(btn.dataset.origText)}`;
      } else {
        btn.disabled = false;
        btn.textContent = btn.dataset.origText || btn.textContent;
        delete btn.dataset.origText;
      }
    }

    function renderTaskPanel() {
      try {
        // Running banner — shown while a fresh run has no checkpoint yet.
        const runningBanner = pendingRunTaskId
          ? `<div class="running-banner">
               <div class="running-dot"></div>
               <div>
                 <div class="running-text">Run in progress</div>
                 <div class="running-sub">${escapeHtml(pendingRunTaskId)} · waiting for first step…</div>
               </div>
             </div>`
          : '';
        const runWaitExtras = runningBanner + pendingRunHelpHtml();

        if (!checkpointsCache.length) {
          taskBody.innerHTML = runWaitExtras +
            (pendingRunTaskId
              ? '<div class="empty"><strong>Starting up.</strong><br>The first step must finish before results appear (30–120 s typical). This view refreshes automatically.</div>'
              : '<div class="empty">No checkpoints yet.<br>Use the <strong>Run task</strong> tab, or <code>npm run run</code> on this machine.</div>');
          return;
        }
        if (!checkpointDetail) {
          const inList = selectedTaskId && checkpointsCache.some(c => c.taskId === selectedTaskId);
          taskBody.innerHTML = runWaitExtras + (inList
            ? skeletonPanel()
            : selectedTaskId
              ? `<div class="empty"><strong>Waiting for checkpoint.</strong><br>Task <code>${escapeHtml(selectedTaskId)}</code> is starting — first step result lands here automatically.</div>`
              : '<div class="empty">Select a task above.</div>');
          return;
        }

        const cp = checkpointDetail;
        const results = cp.results || [];
        const totalSteps = results.length;
        const lastResult = results[results.length - 1];

        // Step cards with eval row.
        const stepCards = results.map(r => {
          const ev = r.evalResult;
          let evalHtml = '';
          if (ev) {
            const s = Math.max(0, Math.min(1, ev.score ?? 0));
            const pct = (s * 100).toFixed(1);
            const col = s >= 0.75 ? '#34d399' : s >= 0.55 ? '#fbbf24' : '#f87171';
            const pathBadge = ev.path === 'llm'
              ? `<span class="badge badge-llm">LLM judge${ev.tee_verified ? ' TEE ✓' : ''}</span>`
              : `<span class="badge badge-heuristic">heuristic</span>`;
            evalHtml = `
              <div class="step-eval">
                <span class="eval-label">fitness</span>
                <div class="eval-bar"><div class="eval-fill" style="width:${pct}%;background:${col}"></div></div>
                <span class="eval-val" style="color:${col}">${s.toFixed(2)}</span>
                ${pathBadge}
              </div>`;
          }
          return `
            <div class="step-card">
              <h3>${escapeHtml(r.stepId)}</h3>
              <div class="sub">node <strong>${escapeHtml(r.nodeId)}</strong> · ${r.latencyMs} ms</div>
              <div class="md-content step-output-md">${renderMarkdown(r.output)}</div>
              ${evalHtml}
            </div>`;
        }).join('');

        // Final answer card — only show when at least 1 step is done.
        const finalAnswerHtml = lastResult ? `
          <div class="final-answer-card">
            <span class="section-label accent">Final answer</span>
            <div class="md-content">${renderMarkdown(lastResult.output)}</div>
          </div>` : '';

        taskBody.innerHTML = `
          ${runWaitExtras}
          <div class="task-meta">
            <span>task: <strong>${escapeHtml(cp.taskId)}</strong></span>
            <span>preset: ${escapeHtml(cp.preset)}</span>
            <span>mesh: ${cp.mesh ? 'yes' : 'no'}</span>
            <span>steps: <strong>${totalSteps}</strong> complete</span>
          </div>
          <div class="task-summary">
            <h2>Goal</h2>
            <div class="md-content">${renderMarkdown(cp.summary) || '<p style="color:var(--muted);margin:0">—</p>'}</div>
          </div>
          ${finalAnswerHtml}
          ${totalSteps ? `<div class="steps-label">Step trace (${totalSteps} step${totalSteps !== 1 ? 's' : ''})</div>${stepCards}` : ''}
        `;
      } finally {
        refreshFollowUpPanel();
      }
    }

    async function poll() {
      try {
        const [lr, cr] = await Promise.all([
          fetch('/lineage'),
          fetch('/checkpoints'),
        ]);
        if (!lr.ok) throw new Error(`lineage HTTP ${lr.status}`);
        if (!cr.ok) throw new Error(`checkpoints HTTP ${cr.status}`);
        const lineageData = await lr.json();
        const cpPayload = await cr.json();
        checkpointsCache = cpPayload.checkpoints || [];

        const lineageHash = JSON.stringify(lineageData);
        if (lineageHash !== lastLineageHash) {
          lastLineageHash = lineageHash;
          renderLineage(lineageData);
        }

        ensureTaskSelection();
        fillTaskSelect();
        fillResumeSelect();
        await fetchCheckpointDetail();
        renderTaskPanel();

        // Tab badge.
        const badge = document.getElementById('tasks-badge');
        if (badge) {
          badge.textContent = String(checkpointsCache.length);
          badge.hidden = checkpointsCache.length === 0;
        }

        // Status pill.
        const runActive = !!pendingRunTaskId;
        statusEl.textContent = runActive
          ? `running · ${checkpointsCache.length} checkpoint${checkpointsCache.length !== 1 ? 's' : ''}`
          : `live · ${lineageData.length} genome${lineageData.length !== 1 ? 's' : ''} · ${checkpointsCache.length} checkpoint${checkpointsCache.length !== 1 ? 's' : ''}`;
        statusEl.className = 'ok';
      } catch (e) {
        statusEl.textContent = `error: ${e.message}`;
        statusEl.className = 'err';
      }
    }

    taskBody.innerHTML = skeletonPanel();
    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
