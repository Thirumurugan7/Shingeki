<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進撃 Shingeki — Genome Lineage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #18181b;
      --border: #27272a;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #6366f1;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; }
    .subtitle { color: var(--muted); font-size: 0.875rem; }
    #status {
      margin-left: auto;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: color 0.3s, border-color 0.3s;
    }
    #status.ok  { color: var(--green);  border-color: var(--green); }
    #status.err { color: var(--red);    border-color: var(--red); }
    #tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 680px;
      margin: 0 auto;
    }
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      transition: border-color 0.25s;
    }
    .card.latest { border-color: var(--accent); box-shadow: 0 0 0 1px #6366f118; }
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.875rem;
      flex-wrap: wrap;
    }
    .genome-id {
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }
    .badge {
      font-size: 0.68rem;
      padding: 0.18rem 0.55rem;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-tee    { background: #16a34a1a; color: var(--green);  border: 1px solid #16a34a55; }
    .badge-latest { background: #6366f11a; color: var(--accent); border: 1px solid #6366f155; }
    .badge-mutated{ background: #eab3081a; color: var(--yellow); border: 1px solid #eab30855; }
    .badge-origin { background: #27272a;   color: var(--muted);  border: 1px solid var(--border); }
    .meta {
      font-size: 0.76rem;
      color: var(--muted);
      display: flex;
      gap: 1.25rem;
      margin-bottom: 0.875rem;
      flex-wrap: wrap;
    }
    .score-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .score-label { font-size: 0.75rem; color: var(--muted); min-width: 3.5rem; }
    .score-bar {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .score-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .score-val  { font-size: 0.75rem; font-weight: 600; min-width: 2.75rem; text-align: right; }
    .connector  { width: 2px; height: 2rem; background: var(--border); }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 5rem 0;
      font-size: 0.9rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>進撃 Shingeki</h1>
    <span class="subtitle">Genome Lineage</span>
    <span id="status">connecting…</span>
  </header>
  <main id="tree"></main>

  <script>
    const tree = document.getElementById('tree');
    const statusEl = document.getElementById('status');
    let lastHash = '';

    function scoreColor(s) {
      if (s >= 0.75) return '#22c55e';
      if (s >= 0.55) return '#eab308';
      return '#ef4444';
    }

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString(undefined, { hour12: false });
    }

    function renderCard(e, isLatest) {
      const s = Math.min(1, Math.max(0, e.fitness_score));
      const pct = (s * 100).toFixed(1);
      const color = scoreColor(s);
      const isRoot = !e.parent_id;

      return `
        <div class="card${isLatest ? ' latest' : ''}">
          <div class="card-header">
            <span class="genome-id">${e.genome_id}</span>
            ${e.tee_verified ? '<span class="badge badge-tee">TEE ✓</span>' : ''}
            ${isLatest    ? '<span class="badge badge-latest">latest</span>' : ''}
            ${!isRoot     ? '<span class="badge badge-mutated">mutated</span>' : '<span class="badge badge-origin">origin</span>'}
          </div>
          <div class="meta">
            <span>model: <strong>${e.model}</strong></span>
            <span>strategy: ${e.strategy}</span>
            <span>steps: ${e.step_count}</span>
            <span>${fmtTime(e.timestamp)}</span>
          </div>
          <div class="score-row">
            <span class="score-label">fitness</span>
            <div class="score-bar">
              <div class="score-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            <span class="score-val" style="color:${color}">${s.toFixed(2)}</span>
          </div>
        </div>`;
    }

    function render(entries) {
      if (!entries.length) {
        tree.innerHTML = '<div class="empty">No genome mutations recorded yet.<br>Start <code>npm run demo -- --mesh</code> to see evolution in action.</div>';
        return;
      }
      const parts = [];
      entries.forEach((e, i) => {
        if (i > 0) parts.push('<div class="connector"></div>');
        parts.push(renderCard(e, i === entries.length - 1));
      });
      tree.innerHTML = parts.join('');
    }

    async function poll() {
      try {
        const res = await fetch('/lineage');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const hash = JSON.stringify(data);
        if (hash !== lastHash) { lastHash = hash; render(data); }
        statusEl.textContent = `live · ${data.length} genome${data.length !== 1 ? 's' : ''}`;
        statusEl.className = 'ok';
      } catch (e) {
        statusEl.textContent = `error: ${e.message}`;
        statusEl.className = 'err';
      }
    }

    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
